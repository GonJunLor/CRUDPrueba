<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title>Crear tarea</title>
</head>
<body>
    <h1>Estas en el Crear tarea</h1>
    <form action="/crearTarea" method="post">
        <label for="nombre">Nombre</label>
        <input class="requerido" type="text" name="nombre" id="nombre" th:value="${valor_nombre}" required>
        <span class="error rojo" th:text="${error_nombre}"></span>

        <label for="descripcion">Descripción</label>
        <input type="text" name="descripcion" id="descripcion" th:value="${valor_descripcion}">

        <label for="categoria">Categoria</label>
        <select class="requerido" name="categoria" id="categoria" required>
            <option th:if="${valor_categoria == ''}" value="" selected disabled hidden>-- Selecciona una categoría --</option>
            <option th:each="categoria : ${categorias}"
                    th:value="${categoria}"
                    th:text="${categoria}"
                    th:selected="${categoria.toString() == valor_categoria}"
            ></option>
        </select>
        <span class="error rojo" th:text="${error_categoria}"></span>

        <!-- El estado es automático no se puede cambiar al crear siempre es Pendiente -->

        <label for="privacidad">Privacidad:</label>
        <input type="radio" id="privado" name="privacidad" value="privado" th:checked="${valor_privacidad=='privado'}">
        <label for="privado">Privado</label>
        <input type="radio" id="publico" name="privacidad" value="publico" th:checked="${valor_privacidad=='publico'}">
        <label for="publico">Público</label>

        <label for="fechaTrabajo">Fecha de trabajo</label>
        <input type="date" name="fechaTrabajo" id="fechaTrabajo" th:value="${valor_fechaTrabajo}">
        <span class="error rojo" th:text="${error_fechaTrabajo}"></span>

        <input type="submit" value="Entrar">
    </form>
    <a href="/">Salir</a>
    <a href="/cerrar">Cerrar Sesion</a>
    <a href="/privado">Volver a inicio privado</a>
</body>
</html>
