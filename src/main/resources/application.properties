spring.application.name=CRUDPrueba
# Reemplaza con tu IP, puerto (por defecto 3306), nombre de tu base de datos, usuario y password
spring.datasource.url=jdbc:mariadb://localhost:3306/pruebacrud
spring.datasource.username=root
spring.datasource.password=paso
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración extra para que Spring cree/actualice las tablas por ti si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true